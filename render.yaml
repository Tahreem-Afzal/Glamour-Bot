services:
  # --- FastAPI backend (chatbot + recommender + image-gen + try-on) ---
  - type: web
    name: glamourai-backend
    runtime: python
    rootDir: backend
    plan: free           # ⚠️ free tier = 512MB RAM; torch + sentence-transformers
                         # loading the embedding model at startup may OOM-crash.
                         # See README "Deploying (Render)" section for what to do if it does.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FASHN_API_KEY
        sync: false         # set manually in the Render dashboard
      - key: STABILITY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: glamourai-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # --- Vite/React frontend, served as a static site ---
  - type: web
    name: glamourai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: glamourai-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html